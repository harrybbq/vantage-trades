[build]
  command = "npm run build"
  publish = "dist/web"
  functions = "netlify/functions"

[build.environment]
  # Pinned: the functions use Node 20+ APIs and an older default would fail at
  # runtime rather than at build time, which is the worse place to find out.
  NODE_VERSION = "22"

  # Netlify scans the build output for the value of every environment variable
  # and fails the build when it finds one. These two are supposed to be in the
  # output: Vite compiles them into the bundle, which is the entire point of
  # the VITE_ prefix, and both are public by construction — the anon key
  # identifies the project and grants nothing on its own.
  #
  # Without this exemption every build fails, Netlify keeps serving the last
  # deploy that succeeded, and each corrected environment variable appears to
  # change nothing at all. That failure mode is why this line exists.
  #
  # Only ever list VITE_ variables here. Exempting a real secret would turn
  # off the check that stops it being published.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"

  # node-postgres is CommonJS and calls require() at load time. Bundled into an
  # ESM output there is no require to call, and the module throws
  # `Dynamic require of "events" is not supported` before any of our code runs.
  # Shipping it as a real dependency instead of inlining it avoids the whole
  # problem. Reproduce with:
  #
  #   npx esbuild netlify/functions/control.ts --bundle --platform=node --format=esm
  #
  # which fails without this and succeeds with --external:pg.
  external_node_modules = ["pg"]

# The SPA is one page; every path that is not the API or a built asset should
# serve it rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # This is a control surface for a brokerage account. It should never be
    # framed, sniffed, or handed to a referrer.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    # Owner-only data. No shared cache may hold a copy.
    Cache-Control = "no-store"

# Environment variables are set in the Netlify UI, never committed. See
# docs/DEPLOY.md for the order to do this in.
#
#   DATABASE_URL          Supabase pooler URI, EU region, ?sslmode=require
#   SUPABASE_URL          for verifying the caller's token
#   SUPABASE_ANON_KEY     for verifying the caller's token
#   OWNER_USER_ID         the only user allowed through
#   BROKER_API_KEY        server-side only, never VITE_-prefixed
#   BROKER_API_SECRET     server-side only, never VITE_-prefixed
#
# Anything prefixed VITE_ is bundled into public JavaScript. No secret may
# ever carry that prefix.
#
# NEVER set AUTH_MODE here. It is a local development bypass that skips the
# owner check entirely; the handler now refuses to start with it on a hosted
# platform, but it should not be reachable in the first place.
