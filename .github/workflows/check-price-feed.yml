name: Check the price feed

# Asks the feed what it would say, from a runner with ordinary network access.
#
# Two things worth knowing and neither is guessable: whether the endpoint still
# answers, and what currency each symbol is quoted in. London quotes some
# instruments in pounds and others in pence, and the difference is a factor of
# a hundred. The code refuses anything that is not sterling, so a surprise here
# shows up as a missing price rather than a wrong one — but a missing price is
# still a stopped agent, and this says so before the schedule does.
#
# No secrets. Public market data, read anonymously.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Space-separated, without the .L suffix'
        required: false
        default: 'VWRP VUSA HSBA SHEL'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: What the feed says
        run: |
          for s in ${{ inputs.symbols }}; do
            url="https://query1.finance.yahoo.com/v8/finance/chart/$s.L?interval=1d&range=1d"
            body=$(curl -sS -m 20 -H 'accept: application/json' "$url" || echo '')

            # The same arithmetic the app does, so this prints the number that
            # would actually be stored rather than the one the feed printed.
            echo "$body" | jq -r --arg s "$s" '
              (.chart.result[0].meta // empty) as $m
              | if $m == null then "\($s): no usable reply from the feed"
                elif ($m.regularMarketPrice | type) != "number" then "\($s): no price"
                elif $m.currency == "GBP" then
                  "\($s): \($m.regularMarketPrice) GBP -> \(($m.regularMarketPrice * 100) | round) pence"
                elif ($m.currency == "GBp" or $m.currency == "GBX") then
                  "\($s): \($m.regularMarketPrice) \($m.currency) -> \($m.regularMarketPrice | round) pence"
                else
                  "\($s): \($m.regularMarketPrice) \($m.currency) -> REFUSED, not sterling"
                end
            ' 2>/dev/null || echo "$s: no usable reply from the feed"
          done
